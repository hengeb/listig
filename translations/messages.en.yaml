    subject: "[Moderation] New mail pending for %list%"
    body: "A mail to list %list% (%mail%) requires your approval.\n\nSubject: %subject%\nFrom: %sender%\nDate: %date%\n\nAccept: mailto:%accept%\nReject: mailto:%reject%\n"
