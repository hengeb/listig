    subject: "Your mail to %list% is awaiting approval"
    body: "Your mail to the list %list% (%mail%) was not delivered immediately — it is awaiting approval by the list owners.\n\nSubject: %subject%\nDate: %date%"

bounce:
  unknown: "unknown"
  owner_notice:
    subject: "[Bounce] %list%: from %sender%"
    body: "A bounce was received for list %list%.\n\nOriginal sender: %original_sender%\nFailed recipient: %failed_recipient%\nReason: %reason%\n\nFrom: %sender%\nSubject: %subject%\n\nThe original bounce is attached."

processing_failure:
  owner_notice:
    subject: "[%list%] Mail could not be processed"
    body: "An incoming mail for list %list% could not be processed after %attempts% attempts and has been archived or deleted without being distributed.\n\nFrom: %sender%\nSubject: %subject%\n\nError: %error%\n\nThe original mail is attached."

queue:
  failure_notice:
    subject: "[%list%] Delivery failure for %recipient%"
    body: "%app_name% could not deliver a mail to %recipient% after 3 attempts.\n\nError: %error%"
  spam_rejected:
    subject: "[%list%] Mail rejected as spam by %domain%"
    body: "A mail to the list %list% was rejected as spam by %domain% (a trusted major mail provider) and has been discarded for %count% remaining recipients, without further delivery attempts.\n\nServer response: %error%"

