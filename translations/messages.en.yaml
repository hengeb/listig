bounce:
  unknown: "unknown"
  owner_notice:
    subject: "[Bounce] %list%: from %sender%"
    body: "A bounce was received for list %list%.\n\nOriginal sender: %original_sender%\nFailed recipient: %failed_recipient%\nReason: %reason%\nAutomatic response: %auto_action%\n\nFrom: %sender%\nSubject: %subject%\n\nThe original bounce is attached."
