services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ../config/config.yml:/app/config/config.yml:ro
      # Optional — see CLAUDE.md "Custom layout".
      # - ../config/custom.latte:/app/config/custom.latte:ro
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: ${DB_NAME:-listig}
      MARIADB_USER: ${DB_USER:-listig}
      MARIADB_PASSWORD: ${DB_PASS:-secret}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:-rootsecret}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  db_data:
