server {
    listen 80;
    server_name _;

    root /app/public;
    index index.php;

    client_max_body_size 20M;

    # Static assets are served directly by nginx, never routed through Slim.
    location /assets/ {
        try_files $uri =404;
    }

    # Everything else goes through the Slim front controller.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Only index.php itself may be executed — no other .php file is reachable.
    # php-fpm runs in the same container (via supervisord), so no DNS resolution is needed.
    location = /index.php {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
    }

    location ~ \.php$ {
        return 404;
    }
}
