# Docker's own HEALTHCHECK (docker/Dockerfile) hits this every ~30s — logging
# it like any other request would mean `docker logs` is mostly healthcheck
# noise.
map $request_uri $loggable_uri {
    ~^/_/health  0;
    default      1;
}

# Bot/scanner traffic (wp-content/, PHP shells, ...) produces a constant stream
# of 404s that drown out anything actually worth seeing (5xx, real errors).
# 405 gets the same treatment: confirmed live, a scan for a path like
# /.git/HEAD can coincidentally path-match a route registered for other HTTP
# methods only (e.g. {listname}/{mail}, PUT/DELETE) and come back 405 instead
# of 404 — same bot noise, just landing on a different status by accident of
# URL shape, not a "real" method-not-allowed worth seeing. Every OTHER status
# (2xx/3xx/401/403/429/5xx/...) still logs normally — this only silences these
# two specific "not really an application-level event" cases, never a real
# failure.
map $status $loggable_status {
    404      0;
    405      0;
    default  1;
}

# access_log's own "if=" condition only takes a single variable, so both
# independent exclusions above are ANDed together here via string
# concatenation: only "11" (loggable by both URI and status) logs; any other
# combination ("10", "01", "00") is suppressed.
map "$loggable_uri$loggable_status" $loggable {
    11       1;
    default  0;
}

server {
    listen 80;
    server_name _;

    root /app/public;
    index index.php;

    client_max_body_size 20M;

    # The canonical access log that reaches `docker logs` — nginx's own
    # $request already contains the real request line (method + full path +
    # query string + protocol) regardless of internal rewrites, unlike
    # php-fpm's own access log (disabled — see docker/php-fpm-pool.conf —
    # so every request is logged exactly once here, not twice). Logging
    # straight to /dev/stdout needs no extra symlink step (the official
    # nginx image instead symlinks its default file target to /dev/stdout;
    # writing here directly is equivalent and one step simpler).
    access_log /dev/stdout combined if=$loggable;

    # Static assets are served directly by nginx, never routed through Slim.
    location /assets/ {
        try_files $uri =404;
    }

    # Everything else goes through the Slim front controller.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Only index.php itself may be executed — no other .php file is reachable.
    # php-fpm runs in the same container (via supervisord), so no DNS resolution is needed.
    location = /index.php {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
    }

    location ~ \.php$ {
        return 404;
    }
}
