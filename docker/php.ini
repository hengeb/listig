; Production hardening: the base php:8.5-fpm-bookworm image ships with
; display_errors=STDOUT and log_errors=Off — any warning/notice (even from a
; vendor library, e.g. php-imap on a transient connection failure) gets echoed
; directly into the HTTP response body instead of the log, which both leaks
; internal file paths and — since output starts before the controller's
; intended status code is sent — silently downgrades error responses to 200.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; Shared-memory cache for the archive viewer's per-mail content cache (see
; Archive\ArchiveMailCache) — in-memory only, per-container, entries expire on
; their own TTL, so there is nothing to clean up manually. apc.enable_cli lets
; CLI scripts (diagnostics, one-off tooling) use it too; php-fpm requests have
; it enabled by default already. shm_size raised from the 32M default since a
; cached mail includes eagerly-fetched attachment bytes, not just HTML.
apc.enable_cli = 1
apc.shm_size = 64M
