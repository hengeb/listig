; Production hardening: the base php:8.5-fpm-bookworm image ships with
; display_errors=STDOUT and log_errors=Off — any warning/notice (even from a
; vendor library, e.g. php-imap on a transient connection failure) gets echoed
; directly into the HTTP response body instead of the log, which both leaks
; internal file paths and — since output starts before the controller's
; intended status code is sent — silently downgrades error responses to 200.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
