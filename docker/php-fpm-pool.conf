[www]
; PHP-FPM's own access log (enabled by the base image's docker.conf via
; access.log = /proc/self/fd/2) is disabled here — nginx's access log
; (docker/nginx.conf) is the canonical one that reaches `docker logs` instead,
; so every request is logged exactly once, not twice, and its
; healthcheck-exclusion (map $loggable) actually has an effect on what
; appears there. It was briefly used for this app's own request logging
; (working around php-fpm's default %r format specifier resolving to
; SCRIPT_NAME — always literally "/index.php" once a request has gone through
; docker/nginx.conf's `try_files $uri /index.php$is_args$args`, rather than the
; real requested path), but per-path log suppression via php-fpm's own
; access.suppress_path[] directive proved unreliable in testing (excluded some
; requests inconsistently, unrelated to their actual path) — nginx's `map` +
; `access_log ... if=` is the well-established mechanism for this instead.
access.log = /dev/null
